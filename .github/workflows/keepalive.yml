name: Supabase wach halten

# Kostenlose Supabase-Projekte pausieren nach 7 Tagen ohne API-Zugriff.
# Diese Abfrage (ohne Login, liefert wegen RLS keine Daten) zählt als Aktivität.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Supabase anfragen
        run: |
          URL=$(sed -n 's/.*supabaseUrl: *"\([^"]*\)".*/\1/p' config.js)
          KEY=$(sed -n 's/.*supabaseKey: *"\([^"]*\)".*/\1/p' config.js)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Supabase noch nicht konfiguriert."; exit 0; fi
          code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/rest/v1/tarif?select=gueltig_ab&limit=1" -H "apikey: $KEY")
          echo "HTTP $code"
          test "$code" -lt 500
