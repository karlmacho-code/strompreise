name: Strompreise aktualisieren

on:
  schedule:
    # Day-Ahead-Preise für morgen erscheinen ca. 13:00 MEZ; zweiter Lauf als Reserve.
    - cron: "20 12 * * *"
    - cron: "20 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preise von Energy-Charts holen
        run: python3 scripts/update.py
      - name: Sonnenstunden Poysdorf Ost (GeoSphere) aktualisieren
        run: python3 scripts/sonne.py
      - name: Änderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Keine neuen Daten."
          else
            git commit -m "Preise aktualisiert $(date -u +%Y-%m-%d\ %H:%M) UTC"
            git push
          fi
